name: Evaluate answers (LLM judge)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of golden questions (0 = all)
        default: "0"

permissions:
  contents: write

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed_cache
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"
          activate-environment: true

      - name: Install dependencies
        run: uv pip install -r requirements.txt

      - name: Cache ONNX models
        uses: actions/cache@v6
        with:
          path: .fastembed_cache
          key: fastembed-${{ hashFiles('src/embeddings/huggingface_eff.py', 'src/retrieval/rerank.py') }}

      - name: Run answer evaluation
        run: python scripts/eval_answers.py --limit "${{ inputs.limit }}"

      - name: Commit results
        run: |
          python -c "import json;s=json.load(open('eval/results_answers.json'))['summary'];print('## Answer evaluation');print('| ' + ' | '.join(s) + ' |');print('|' + '---|'*len(s));print('| ' + ' | '.join(str(v) for v in s.values()) + ' |')" >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add eval/results_answers.json
          git diff --cached --quiet || (git commit -m "Update answer evaluation results" && git push)
